[package]
name = "wallet-a-atomic-executor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "3.0.0"

[dev-dependencies]
solana-banks-client = "3.0.0"
solana-program-test = "3.0.0"
solana-sdk = "3.0.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
